<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kaijus especiales</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: #c2bfe3;
            font-family: Arial, Helvetica, sans-serif;
        }

        .portada {
            width: 100%;
            min-height: 300px;

            background: linear-gradient(
                135deg,
                #4c5a84,
                #6674a3
            );

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 40px 20px;
        }

        .contenido-portada {
            background-color: rgba(255, 255, 255, 0.10);

            padding: 35px 60px;
            border-radius: 20px;

            border: 1px solid rgba(255, 255, 255, 0.25);

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .portada h1 {
            color: white;
            font-size: 45px;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .portada p {
            color: #e8e6f7;
            font-size: 20px;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <!-- PORTADA -->
    <section class="portada">

        <div class="contenido-portada">

            <h1>Kaijus</h1>

            <p>♡ rangos ♡</p>

        </div>

    </section>


      <!-- ENLACE CON JAVASCRIPT -->
<script src="js/script.js"></script>


<script src="ejercicios.js"></script>


</body>

</html>
